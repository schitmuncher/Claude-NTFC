<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101713" />
    <meta name="description" content="Nantwich Town FC fixtures, table, squad and live scores." />
    <title>The Dabbers | Nantwich Town FC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: "#1B4D3E",
              "forest-dark": "#12382d",
              gold: "#F3C64C",
              charcoal: "#101713",
              canvas: "#F5F7F3",
              ink: "#1A241F",
              mist: "#DDE7DF",
              slate: "#738078",
            },
            fontFamily: {
              display: ["Space Grotesk", "ui-sans-serif", "system-ui"],
              sans: ["DM Sans", "ui-sans-serif", "system-ui"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; }
      body { min-width: 320px; background: #101713; font-family: "DM Sans", sans-serif; }
      h1, h2, h3, .display { font-family: "Space Grotesk", sans-serif; }
      .safe-bottom { padding-bottom: calc(6.5rem + env(safe-area-inset-bottom)); }
      .safe-dock { padding-bottom: env(safe-area-inset-bottom); }
      .tab-button[aria-selected="true"] .tab-pill { background: #f3c64c; color: #101713; }
      .tab-button[aria-selected="true"] .tab-label { color: #f3c64c; font-weight: 700; }
      .tab-button:focus-visible, button:focus-visible { outline: 3px solid rgba(243,198,76,.6); outline-offset: 2px; }
      .skeleton { position: relative; overflow: hidden; background: #dfe8e0; }
      .skeleton::after { position: absolute; inset: 0; content: ""; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: shimmer 1.3s infinite; }
      @keyframes shimmer { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
      @media (min-width: 768px) { .safe-bottom { padding-bottom: 2rem; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
